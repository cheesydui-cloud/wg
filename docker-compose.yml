services:
  wg-panel:
    build: .
    container_name: wg-panel
    restart: unless-stopped
    network_mode: host
    environment:
      WG_PORT: "51821"
      WG_PASSWORD: "${WG_PASSWORD:-}"
      WG_DATA_DIR: /data
      WG_ALLOW_APPLY: "1"
    volumes:
      - ./data:/data
      - /etc/wireguard:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
